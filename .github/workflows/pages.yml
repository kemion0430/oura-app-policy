name: Deploy Pages

# GitHub Pages を有効化して callback.html を配信する。
#
# Settings → Pages を開かずに済ませるためのもの。GitHub のスマホアプリには
# リポジトリの Settings が無く、ブラウザに切り替えられない状況でも
# ここから有効化できる。configure-pages の enablement が、Pages が未作成なら
# API で作成してくれる。
on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages の作成とデプロイに要る権限。既定の read だけでは足りない
permissions:
  contents: read
  pages: write
  id-token: write

# デプロイは同時に走らせない。途中で打ち切ると中途半端な状態で公開されるため
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Pages が未作成なら作る。ここが Settings 画面の代わり
          enablement: true

      # 公開するのは callback.html だけにする。リポジトリごと上げると .git まで
      # 含まれるうえ、ポリシー文書は github.com のURLで既に参照されている
      - name: Build site
        run: |
          mkdir -p _site
          cp callback.html _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
